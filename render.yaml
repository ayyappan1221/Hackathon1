# Render Infrastructure as Code
# Deploy with: render deploy --config render.yaml
# Or push to git and connect repo in Render dashboard

services:
  # Backend API Service
  - type: web
    name: eleguard-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: EMAIL_ENABLED
        value: "true"
      - key: EMAIL_SENDER
        sync: false  # Set in Render dashboard
      - key: EMAIL_APP_PASSWORD
        sync: false  # Set in Render dashboard
      - key: EMAIL_RECIPIENT
        sync: false  # Set in Render dashboard
      - key: EMAIL_SMTP_HOST
        value: smtp.gmail.com
      - key: EMAIL_SMTP_PORT
        value: "587"
      - key: SMS_COOLDOWN_SECONDS
        value: "60"
      - key: SENSOR_STALE_SECONDS
        value: "8"
      - key: ALERT_MODE_COOLDOWN_SECONDS
        value: "8"
      - key: FOREST_LIMIT
        value: "0.45"
      - key: VILLAGE_LIMIT
        value: "0.72"
      - key: CORS_ORIGINS
        value: "https://eleguard-frontend.onrender.com"
    healthCheckPath: /
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: eleguard-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://eleguard-backend.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://eleguard-backend.onrender.com/api/*
      - type: rewrite
        source: /api/video-feed
        destination: https://eleguard-backend.onrender.com/api/video-feed
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

databases:
  # SQLite is file-based, no managed DB needed for this prototype
  # If you want PostgreSQL later, uncomment and update database.py:
  # - name: eleguard-db
  #   databaseName: eleguard
  #   user: eleguard
  #   plan: free