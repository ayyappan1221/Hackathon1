# EleGuard AI - Render Blueprint (render.yaml) - FIXED for 'requirements.txt not found'
# Root-cause: previous buildCommand 'pip install -r requirements.txt' runs from repo root,
# but file lives at backend/requirements.txt. Fixed to backend/requirements.txt.
# Also: startCommand now 'cd backend && uvicorn main:app' so it works from repo root
# regardless of rootDir support. Frontend uses 'cd frontend && ...' pattern.
# Works for both master (Render's default) and main branches.

services:
  # ============ BACKEND: FastAPI (Python) ============
  - type: web
    name: eleguard-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ALLOW_ALL
        value: true
      - key: ALLOWED_ORIGINS
        value: https://eleguard-frontend.onrender.com,http://localhost:5173
      - key: CORS_ORIGINS
        value: https://eleguard-frontend.onrender.com
      - key: EMAIL_ENABLED
        value: true
      - key: EMAIL_SENDER
        value: dharshinia.2025ibm@gmail.com
        sync: false
      - key: EMAIL_APP_PASSWORD
        value: udvezmrpgbbvxazf
        sync: false
      - key: EMAIL_RECIPIENT
        value: dharshinia.2025ibm@gmail.com
        sync: false
      - key: EMAIL_SMTP_HOST
        value: smtp.gmail.com
      - key: EMAIL_SMTP_PORT
        value: "587"
      - key: SMS_COOLDOWN_SECONDS
        value: "60"
      - key: SENSOR_STALE_SECONDS
        value: "8"
      - key: ALERT_MODE_COOLDOWN_SECONDS
        value: "8"
      - key: FOREST_LIMIT
        value: "0.45"
      - key: VILLAGE_LIMIT
        value: "0.72"

  # ============ FRONTEND: Vite React (Static Site) ============
  - type: web
    name: eleguard-frontend
    runtime: static
    region: singapore
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    # SPA fallback
    routes:
      - type: rewrite
        source: /api/*
        destination: https://eleguard-backend.onrender.com/api/*
      - type: rewrite
        source: /api/video-feed
        destination: https://eleguard-backend.onrender.com/api/video-feed
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://eleguard-backend.onrender.com
        # AFTER backend deploys, Render assigns real URL like https://eleguard-backend-xxxx.onrender.com
        # Update this in Dashboard -> eleguard-frontend -> Environment if it differs
