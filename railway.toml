# EleGuard AI - One-click Railway (single service)
# Just click "Deploy" on https://railway.app/new → GitHub repo ayyappan1221/Hackathon1
# No Root Directory needed - Dockerfile builds frontend + backend together

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
numReplicas = 1
