# EleGuard AI - One-click Railway (single service via Dockerfile)

# No Root Directory needed - builds frontend + backend together

[build]
builder = "dockerfile"

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"